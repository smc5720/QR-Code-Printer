name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install qrcode[pil] pillow pywin32 pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name QR-Code-Printer qr_printer.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/QR-Code-Printer.exe
            qr_printer.py
