name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install qrcode[pil] pillow pywin32 pyinstaller

      - name: Inject API key
        if: env.QR_PRINTER_API_KEY != ''
        env:
          QR_PRINTER_API_KEY: ${{ secrets.QR_PRINTER_API_KEY }}
        shell: python
        run: |
          import os
          key = os.environ["QR_PRINTER_API_KEY"]
          with open("qr_printer.py", "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace('API_KEY = ""', f'API_KEY = "{key}"', 1)
          with open("qr_printer.py", "w", encoding="utf-8") as f:
              f.write(content)

      - name: Build exe
        run: pyinstaller --onefile --windowed --icon=icon.ico --add-data "icon.ico;." --name QR-Code-Printer qr_printer.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/QR-Code-Printer.exe
            qr_printer.py
